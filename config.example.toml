# =====================================================================
#  AutoCortes - configuração
#
#  1) Copie este arquivo para config.toml (ou rode: python -m autocortes init)
#  2) Coloque os filmes na pasta "filmes"
#  3) python -m autocortes verificar
#  4) python -m autocortes rodar        (loop infinito: analisa, edita e posta)
#
#  Enquanto [geral].simulacao = true NADA é enviado para as redes: os vídeos
#  editados ficam em dados/cortes e o log mostra o que teria sido postado.
#
#  Direitos autorais: use filmes que você tem direito de publicar (domínio
#  público, Creative Commons, conteúdo próprio ou licenciado). Cortes de
#  filmes protegidos geram Content ID, strikes e podem derrubar a conta.
# =====================================================================

[geral]
# Nome deste perfil (nicho) no painel. Vazio = "Principal".
# Cada perfil tem sua pasta, suas contas, seu tema e sua agenda: crie em Perfis, no painel.
perfil = ""
# Abrir este perfil junto com o principal (vale só nos perfis dentro de perfis/)
autoiniciar = false
simulacao = true
pasta_filmes = "filmes"
pasta_dados = "dados"
# Quantos cortes prontos manter à frente das postagens
buffer_cortes = 3
# Analisar filmes novos no tempo livre, mesmo sobrando cortes
analisar_antecipado = true
# Cada corte editado espera sua aprovação no painel antes de entrar na fila
exigir_aprovacao = false
# FFmpeg/Whisper com prioridade baixa para não travar o PC
prioridade_baixa = true
# Impede o Windows de suspender enquanto o loop roda
impedir_suspensao = true
# Apaga o .mp4 depois de publicado em todas as redes ativas
apagar_apos_postar = false
# Intervalo para procurar filmes novos na pasta (minutos)
varrer_a_cada_min = 5

[painel]
# Endereço do painel: http://127.0.0.1:8777 (só este computador acessa)
porta = 8777
abrir_navegador = true

[ferramentas]
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
# Vazio = baixa o whisper.cpp oficial automaticamente em ferramentas/whisper
whisper_cli = ""
whisper_vad = ""
# Só versões com o SHA-256 conferido no código. Para outra, instale à mão e
# preencha whisper_cli e whisper_vad acima
whisper_versao = "b5130"
# Threads do Whisper (0 = automático)
threads = 0
# Decodificação por hardware na detecção de cenas: "auto" ou "none"
hwaccel = "auto"
# Programa que baixa os vídeos dos canais do YouTube. Vazio = baixa o yt-dlp
# oficial (conferido pelo SHA-256) em ferramentas/yt-dlp
ytdlp = ""
# O yt-dlp oficial se atualiza sozinho a cada 3 dias: o YouTube muda e versões
# antigas param de baixar. Com o seu yt-dlp (ytdlp acima), quem atualiza é você.
ytdlp_atualizar = true

# ---------------------------------------------------------------------
# Canais do YouTube (opcional): o AutoCortes olha os canais que você
# cadastrar na tela Filmes e baixa os vídeos novos para a pasta de filmes,
# onde eles são analisados e cortados como qualquer filme.
#  Só use canais seus ou que autorizam cortes, com crédito: baixar vídeo
#  de terceiros sem permissão viola os termos do YouTube e os direitos de
#  quem fez, e os cortes podem levar reivindicação ou derrubar a conta.
# ---------------------------------------------------------------------
[canais]
ativo = false
# De quantas em quantas horas os canais são olhados
verificar_a_cada_horas = 6
# Só vídeos publicados nos últimos N dias (0 = qualquer data)
max_idade_dias = 30
# Duração do vídeo, em minutos (0 no máximo = sem limite)
minutos_min = 5
minutos_max = 240
# Transmissões ao vivo que já terminaram (a aba "Ao vivo" do canal)
incluir_ao_vivo = false
# Vídeos novos de cada canal por vez
max_por_canal = 2
# Não baixa mais enquanto houver estes vídeos baixados esperando a análise
max_na_fila = 3
# Resolução máxima: 480, 720, 1080, 1440 ou 2160
resolucao = 1080
# Pula vídeos com estas palavras no título (maiúscula e acento não importam)
ignorar_palavras = []
# Legendas que o canal publicou (as automáticas não entram): poupam a transcrição
legendas = true
# Espaço livre mínimo no disco da pasta de filmes, em GB
espaco_minimo_gb = 20
# Subpasta da pasta de filmes que recebe os vídeos, com uma pasta por canal
pasta = "YouTube"

[analise]
# Pula abertura e créditos finais (limitado a 5% e 10% da duração)
ignorar_inicio_seg = 90
ignorar_fim_seg = 420
# Sensibilidade da troca de cena (menor = detecta mais trocas)
limiar_cena = 10
# Faixa de áudio preferida, pelo idioma marcado no arquivo
idiomas_audio = ["por", "pt"]

[transcricao]
# De onde vêm as legendas:
#   "auto"    = .srt ao lado do filme > legenda embutida > Whisper
#               (com áudio dublado, a legenda embutida costuma ser a do original: aí transcreve a dublagem)
#   "whisper" = sempre transcrever o áudio
#   "arquivo" = só .srt/legenda embutida
#   "nenhuma" = vídeos sem legenda
fonte = "auto"
idiomas_legenda = ["pt-BR", "pt", "por", "pob"]
# Modelo: tiny, base, small, medium, large-v3-turbo, large-v3-turbo-q5_0 ...
# "small" é um bom equilíbrio para português; "base" é ~3x mais rápido.
modelo = "small"
# Idioma falado: "auto", "pt", "en", "es"...
idioma = "auto"

[cortes]
duracao_min = 30
duracao_max = 60
duracao_alvo = 45
max_por_filme = 40
espaco_minimo_seg = 5
# Palavras que valorizam um trecho (acentos são ignorados na comparação)
palavras_chave = []
# "intercalar" alterna entre filmes; "sequencial" termina um filme antes do próximo
ordem_filmes = "intercalar"
# "melhores" posta primeiro os trechos de maior nota; "cronologica" segue o filme
ordem_cortes = "melhores"

[cortes.pesos]
volume = 1.0     # trechos mais altos
picos = 1.5      # momentos intensos (explosões, gritos, música alta)
fala = 1.2       # quantidade de diálogo
cenas = 0.8      # ritmo de edição (trocas de cena por minuto)
gancho = 1.0     # começo forte nos 3 primeiros segundos
texto = 0.6      # falas com ! ? e palavras-chave
duracao = 0.5    # proximidade da duracao_alvo
abertura = 0.6   # começo claro (perde nota se abre com "então", "mas" ou no meio de uma frase)
silencio = 2.0   # penalidade por silêncio

[edicao]
# Modelo visual em uso. O visual de cada modelo se ajusta na aba Estúdio do painel
# e fica salvo em dados/modelos_visuais.json; as opções abaixo são as do modelo em uso.
# Para trocar de modelo, use o Estúdio. Se trocar este nome à mão pelo de outro modelo,
# o painel aplica o visual dele ao abrir; um nome novo só renomeia o modelo em uso.
modelo = "Padrão"
largura = 1080
altura = 1920
# Moldura: imagem PNG por cima do vídeo, com a área do vídeo transparente.
# O vídeo, o título e a legenda ficam dentro dessa área. "" = sem moldura.
moldura = ""
# "desfocado" = filme no centro com fundo borrado
# "preto" = filme no centro com fundo preto
# "preencher" = corta as laterais e ocupa a tela (ou a área da moldura) inteira
layout = "desfocado"
# Tamanho do filme: 1.0 = largura inteira (da tela ou da moldura), acima corta
# as laterais, abaixo deixa o filme menor
zoom = 1.25
# Centro do filme na altura, em pixels (0 = automático)
posicao_video = 0
desfoque_fundo = 20
escurecer_fundo = 0.12
legendas = true
palavras_por_bloco = 3
max_caracteres_bloco = 18
maiusculas = true
fonte_arquivo = "C:/Windows/Fonts/ariblk.ttf"
fonte_nome = "Arial Black"
tamanho_legenda = 76
cor_legenda = "FFFFFF"
cor_destaque = "FFD400"
contorno_legenda = 6
# Onde fica a legenda: "automatico" (abaixo do filme se couber na área que os apps
# não cobrem, senão sobre a parte de baixo dele), "abaixo" (sempre abaixo do filme)
# ou "sobre" (sempre sobre a parte de baixo do filme)
legenda_lugar = "automatico"
# Centro vertical da legenda em pixels (0 = segue o legenda_lugar)
posicao_legenda = 0
# Texto fixo no topo. Variáveis: {filme} {ano} {parte}. \n quebra a linha. "" desativa.
texto_topo = "{filme}\nParte {parte}"
tamanho_topo = 60
cor_topo = "FFFFFF"
# Fonte do título ("" = a mesma da legenda)
fonte_topo_arquivo = ""
fonte_topo_nome = ""
# Base do título em pixels (0 = automático, acima do filme)
posicao_topo = 0
barra_progresso = true
cor_barra = "FFD400"
fade = true
normalizar_audio = true
# libx264 (CPU, melhor qualidade) ou h264_amf / h264_nvenc / h264_qsv (placa de vídeo)
codec = "libx264"
preset = "medium"
crf = 20

[textos]
# Variáveis: {filme} {ano} {ano_parenteses} {parte} {frase} {hashtags}
# Nos vídeos baixados de um canal do YouTube, também {canal} e {link_original} (o crédito)
# Texto escrito à mão no painel vale mais; depois o da IA (se ligada); depois estes.
titulo = "{filme} - Parte {parte}"
descricao = """{frase}

{filme}{ano_parenteses} - Parte {parte}

{hashtags}"""
# Usados quando a IA escreveu os textos do corte ({titulo_ia} e {descricao_ia} vêm dela)
titulo_ia = "{titulo_ia} | {filme} - Parte {parte}"
descricao_ia = """{descricao_ia}

{filme}{ano_parenteses} - Parte {parte}

{hashtags}"""
# Ordem nas postagens: hashtag do filme, as do <filme>.json, as da IA e depois estas.
# O YouTube mostra só as 3 primeiras acima do título e o Instagram recebe no máximo 5.
hashtags = ["#filmes", "#cinema", "#cenasdefilmes", "#filme"]
hashtag_do_filme = true
max_hashtags = 8

# ---------------------------------------------------------------------
# IA para títulos, descrições e hashtags (opcional)
#  Qualquer API compatível com a da OpenAI. O padrão é o Ollama local
#  (https://ollama.com): nada sai do seu PC. Depois de instalar, rode:
#    ollama pull qwen3:4b-instruct-2507-q4_K_M
#  Com um serviço na internet (OpenRouter, OpenAI...), a fala de cada corte
#  é enviada para ele. Se a IA falhar, valem os modelos de [textos].
# ---------------------------------------------------------------------
[ia]
ativo = false
url = "http://127.0.0.1:11434/v1"
modelo = "qwen3:4b-instruct-2507-q4_K_M"
api_key = ""
temperatura = 0.7
tempo_limite_seg = 180

# ---------------------------------------------------------------------
# Upload-Post (opcional): serviço pago já auditado pelas redes, que posta
# em PÚBLICO inclusive no TikTok. Seus vídeos e o acesso às contas passam
# por ele (https://www.upload-post.com/privacy-policy).
#  1. Crie a conta em upload-post.com e gere a chave da API
#  2. Em app.upload-post.com/manage-users, crie um perfil e conecte as redes
#  3. Preencha abaixo e, em cada rede que quiser, use envio = "upload_post"
#  O TikTok não está no plano grátis.
# ---------------------------------------------------------------------
[upload_post]
api_key = ""
perfil = ""

# ---------------------------------------------------------------------
# Postagem à mão: Kwai, Bilibili (sem API aberta) e qualquer rede com
# envio = "manual". No horário da agenda, o AutoCortes cria uma tarefa no
# Início do painel com o vídeo e os textos no formato da rede; você posta
# pelo app ou pelo site e marca como feito. Nada é enviado sozinho.
# ---------------------------------------------------------------------
[manual]
# Pasta sincronizada (OneDrive, Google Drive...) que recebe uma cópia do
# vídeo e um .txt com os textos de cada tarefa, numa subpasta por rede,
# para pegar no celular. As cópias somem quando a tarefa é feita ou pulada.
# "" = não copia.
pasta = ""

# ---------------------------------------------------------------------
# Postagem pelo navegador (envio = "navegador"): o AutoCortes preenche a
# página de envio da própria rede, no Chrome, com um perfil separado em
# dados/chrome. Você entra na conta uma vez e a sessão fica salva ali.
#
# ATENÇÃO: isto contraria os termos de uso das redes, que só autorizam as
# APIs oficiais, e pode custar a conta. Não há disfarce: sem forjar
# fingerprint, sem resolver captcha, sem proxy. Se a rede pedir verificação,
# o envio para e avisa. Use com a conta que você pode perder.
#
# Funciona em YouTube, TikTok, Instagram e Bilibili. O Kwai não entra: o
# upload dele é só pelo app do celular.
# ---------------------------------------------------------------------
[navegador]
# "" acha o Chrome e, se não houver, o Edge
programa = ""
# Porta do DevTools, só em 127.0.0.1
porta = 9222
# false esconde a janela; para entrar na conta e para ver o que houve, deixe true
visivel = true
# Pausa aleatória entre os passos, em segundos
pausa_min_seg = 0.4
pausa_max_seg = 1.6
tempo_limite_seg = 180
# true preenche tudo e NÃO publica, guardando uma imagem da tela (para conferir).
# A postagem fica como ensaio, e o corte continua na fila daquela rede
ensaio = false

# ---------------------------------------------------------------------
# Vídeos criados do zero (motivacional, frases, curiosidades): a narração
# define o tempo, as imagens de fundo entram atrás e a legenda sai palavra
# por palavra, no tempo exato da voz. Escreva as pautas em pautas/*.txt e
# rode: python -m autocortes criar
#
# Originalidade: juntar clipe de banco com voz sintética é o formato que as
# redes mais olham com lupa. Serve para crescer, mas não conte com
# monetização direta. Veja o README.
# ---------------------------------------------------------------------
[criacao]
ativo = false
# Quem sai primeiro quando falta estoque: "filmes" (os cortes) ou "criacao" (as pautas)
prioridade = "filmes"
# Duração que a IA tenta atingir no roteiro que ela escreve
duracao_alvo_seg = 40
fps = 30
# Segundos de imagem depois da última palavra
cauda_seg = 0.6
# Troca a ordem dos clipes em cada vídeo
embaralhar_clipes = true
# Zoom lento nas imagens paradas (sem isso parece apresentação de slides)
ken_burns = true
# Pasta com músicas de fundo ("" = sem música). A música abaixa sozinha sob a voz.
pasta_musicas = ""
volume_musica = 0.18
fade_audio_seg = 0.6

[estoque]
# De onde vêm as imagens de fundo:
#   "pasta"   = seus vídeos e imagens, sem chave e sem internet
#   "pexels"  = banco gratuito (chave em pexels.com/api)
#   "pixabay" = banco gratuito (chave em pixabay.com/api/docs)
fonte = "pasta"
# Pasta dos seus arquivos ("" = a pasta "material" ao lado deste config)
pasta = ""
# Várias chaves são alternadas, porque cada uma tem limite de uso por hora.
# São segredo: o painel não as mostra de volta, só diz se estão preenchidas.
pexels_chaves = []
pixabay_chaves = []
# Clipe mais curto que isto não entra
duracao_min_seg = 3.0
# Não repetir material que já saiu antes (as redes tratam repetição como não original)
evitar_repetidos = true

[voz]
# Narração dos vídeos criados. "edge" = serviço de leitura em voz alta do
# Microsoft Edge: gratuito, vozes neurais e devolve o tempo de cada palavra
# (é o que faz a legenda casar com a voz). O texto do roteiro sai do PC.
motor = "edge"
voz = "pt-BR-AntonioNeural"
# Velocidade, tom e volume da fala
ritmo = "+0%"
tom = "+0Hz"
volume = "+0%"
# Silêncio entre as linhas do roteiro (use [pausa: 2s] no texto para uma pausa maior)
pausa_linha_seg = 0.35
tempo_limite_seg = 120

[metricas]
# Lê visualizações, curtidas e comentários dos posts (YouTube e Instagram pela API oficial)
ativo = true
intervalo_horas = 6
janela_dias = 14

# ---------------------------------------------------------------------
# Posts de imagem tirados dos cortes (opcional). Cada rede tem as caixas
# videos e imagens; as imagens saem só no TikTok (9:16) e no Instagram
# (4:5), só com envio = "navegador" e o roteiro de imagem gravado em
# Redes sociais. Tipos:
#   "momento"   = um quadro forte com o nome do filme e a parte
#   "frase"     = a fala real do trecho sobre o quadro (só cortes com fala)
#   "carrossel" = de 3 a 5 quadros de cenas diferentes, em ordem
# A fonte e as cores vêm do modelo visual em uso (Estúdio).
#
# Originalidade: a imagem continua sendo um quadro do filme. Use filmes
# que você tem direito de publicar; as redes tratam como não original o
# que só junta trechos de terceiros com texto por cima.
# ---------------------------------------------------------------------
[imagens]
tipos = ["momento", "frase", "carrossel"]
# Quadros do carrossel (de 3 a 5)
quadros_carrossel = 4
# Texto desenhado em cima do quadro. Variáveis: {filme} {ano} {parte}. \n quebra a linha.
topo = "{filme}\nParte {parte}"
# Chamada para o vídeo, desenhada embaixo do quadro. Só aparece quando o
# vídeo daquela parte já saiu nesta rede.
chamada = "A Parte {parte} completa está no perfil"
# Legenda de cada tipo de post. Variáveis: {filme} {ano} {ano_parenteses}
# {parte} {frase} {hashtags} {canal} {link_original} {titulo_ia}
# {descricao_ia} {quadros} (quadros do carrossel) e {chamada_perfil}
# (a chamada para o vídeo; só aparece quando o vídeo daquela parte já
# saiu nesta rede). Linha com uma variável vazia some inteira.
# O texto que você escreve à mão no corte vale só para o vídeo.
legenda_momento = """{titulo_ia}

{filme}{ano_parenteses} - Parte {parte}
{chamada_perfil}

{hashtags}"""
legenda_frase = """“{frase}”

{filme}{ano_parenteses}

{hashtags}"""
legenda_carrossel = """{filme}{ano_parenteses} - Parte {parte}, em {quadros} cenas.
{chamada_perfil}

{hashtags}"""
# Usa o texto que a IA já escreveu para o corte ({titulo_ia} e {descricao_ia}),
# sem chamar a IA de novo
usar_ia = true

[agenda]
# Horários (hora local do PC) das redes que ficarem sem horários próprios.
# Cada rede tem os seus em [youtube], [tiktok], [instagram], [kwai] e [bilibili].
horarios = ["12:00", "18:00", "21:00"]
# Dias da semana em que posta: seg, ter, qua, qui, sex, sab, dom
dias = ["seg", "ter", "qua", "qui", "sex", "sab", "dom"]
# Atraso aleatório de 0 a N minutos em cada horário (sorteado uma vez por dia)
variacao_minutos = 10
# Se o PC estava desligado no horário, ainda posta até N minutos depois
tolerancia_minutos = 90
# Intervalo mínimo entre dois posts na mesma rede (conta os de fora da agenda e as tarefas à mão)
intervalo_minimo_min = 60
# Limite de segurança por rede em 24 horas
maximo_por_dia = 6
# Tentativas por horário quando a rede dá erro, e espera entre elas
max_tentativas = 3
espera_erro_min = 10
# true segura as postagens sem parar a edição
pausado = false

# ---------------------------------------------------------------------
# YouTube Shorts
#  1. console.cloud.google.com > crie um projeto > ative "YouTube Data API v3"
#  2. Tela de consentimento OAuth: público Externo, adicione seu e-mail como
#     usuário de teste e depois PUBLIQUE o app (em modo "Teste" o login
#     expira a cada 7 dias)
#  3. Credenciais > Criar ID do cliente OAuth > "App para computador"
#  4. Cole client_id e client_secret abaixo e rode:
#       python -m autocortes auth youtube
#  Projetos não auditados pelo YouTube enviam os vídeos como PRIVADOS.
#  Para publicar como público é preciso pedir a auditoria da API.
# ---------------------------------------------------------------------
[youtube]
ativo = true
# Posta os cortes em vídeo nesta rede (o YouTube ainda não posta imagens)
videos = true
# "oficial" (API do YouTube), "upload_post" (veja [upload_post]), "navegador"
# (veja [navegador]: contraria os termos) ou "manual" (veja [manual])
envio = "oficial"
# Porta do retorno do login (0 = escolhe uma livre)
porta_redirect = 0
client_id = ""
client_secret = ""
# public, unlisted ou private
privacidade = "public"
# 1 = Filmes e animação, 24 = Entretenimento
categoria = "1"
tags = ["filmes", "cinema", "shorts"]
adicionar_shorts = true
# O YouTube só recebe Shorts: vídeo vertical ou quadrado de até max_segundos
# (de 15 a 180; o Short vai até 3 min). Cortes mais longos ficam para as outras redes.
max_segundos = 180
# Agenda desta rede. Lista vazia usa os horários e dias de [agenda].
horarios = ["12:30", "15:00", "20:00"]
dias = []

# ---------------------------------------------------------------------
# TikTok
#  1. developers.tiktok.com > Manage apps > crie um app
#  2. Adicione "Login Kit" e "Content Posting API" (ligue "Direct Post")
#  3. Em Login Kit, plataforma Desktop, redirect URI:
#       http://127.0.0.1:8765/callback/
#  4. Cole client_key e client_secret e rode: python -m autocortes auth tiktok
#  Apps NÃO auditados só publicam como SELF_ONLY (só você vê) e a conta
#  precisa estar privada. As regras do TikTok não aprovam auditoria de
#  ferramentas para postar nas próprias contas.
#  modo = "rascunho" envia para a caixa de entrada do app e você finaliza
#  a postagem no celular (limite de 5 pendentes por dia).
# ---------------------------------------------------------------------
[tiktok]
ativo = true
# Vídeos e imagens (veja [imagens]). Uma das duas precisa estar ligada.
videos = true
imagens = false
# "oficial" (só posts privados sem auditoria), "upload_post" (público; use
# privacidade = "PUBLIC_TO_EVERYONE"), "navegador" (veja [navegador]:
# contraria os termos) ou "manual" (você posta pelo app)
envio = "oficial"
client_key = ""
client_secret = ""
porta_redirect = 8765
# "direto" ou "rascunho"
modo = "direto"
# SELF_ONLY, MUTUAL_FOLLOW_FRIENDS, FOLLOWER_OF_CREATOR ou PUBLIC_TO_EVERYONE
privacidade = "SELF_ONLY"
permitir_comentarios = true
permitir_duet = false
permitir_stitch = false
capa_ms = 1000
horarios = ["12:00", "18:30", "21:00"]
dias = []
# Horários dos posts de imagem. Perto demais de um vídeo (menos que o
# intervalo mínimo mais a variação), o horário de imagem sai do dia.
horarios_imagens = ["10:30", "15:30"]
# Vazio = os mesmos dias dos vídeos desta rede
dias_imagens = []

# ---------------------------------------------------------------------
# Instagram Reels (API do Instagram com Login do Facebook)
#  1. Conta do Instagram profissional (Criador ou Empresa) vinculada a
#     uma Página do Facebook
#  2. developers.facebook.com > Criar app (Empresa) > adicione o produto
#     Instagram (API com login do Facebook)
#  3. Cole app_id e app_secret e rode: python -m autocortes auth instagram
#     (o comando explica como gerar o token no Graph API Explorer)
#  Com o app em modo de desenvolvimento funciona para contas que têm
#  função no app (a sua), sem App Review.
# ---------------------------------------------------------------------
[instagram]
ativo = true
# Vídeos e imagens (veja [imagens]). Uma das duas precisa estar ligada.
videos = true
imagens = false
# "oficial" (API do Instagram), "upload_post", "navegador" (veja [navegador]:
# contraria os termos) ou "manual" (você posta pelo app)
envio = "oficial"
app_id = ""
app_secret = ""
versao_api = "v26.0"
compartilhar_no_feed = true
capa_ms = 1000
# Reel de teste: aparece primeiro só para quem não segue a conta.
# trial_graduacao = "SS_PERFORMANCE" libera para os seguidores se for bem; "MANUAL" você libera no app.
trial_reels = false
trial_graduacao = "SS_PERFORMANCE"
# A Página do Facebook agora é a rede [facebook], com horários próprios.
horarios = ["12:15", "19:00"]
dias = []
# Horários dos posts de imagem (veja [tiktok]) e os dias (vazio = os dos vídeos)
horarios_imagens = ["10:00", "16:00"]
dias_imagens = []

# ---------------------------------------------------------------------
# Facebook: Reels na Página (nunca no perfil pessoal), com agenda própria.
# Formas de envio:
#  - "navegador" (veja [navegador]: contraria os termos): antes de cada post
#    e de novo logo antes de publicar, o AutoCortes confere que o Chrome está
#    agindo como a Página. Se não estiver, troca pelo seletor de perfis do
#    Facebook e confere de novo; sem confirmar, não posta e pausa a rede até
#    você testar a conta em Redes sociais.
#  - "oficial" (API de Reels da Página): precisa da permissão
#    pages_manage_posts no app da Meta. Sem app_id/app_secret aqui, vale o
#    app do [instagram]; sem login próprio, vale o do Instagram.
#  - "upload_post": a Página conectada no perfil do Upload-Post.
#  - "manual": a tarefa no Início, para você postar.
# Se a Central de Contas já repassa os Reels do Instagram para a Página,
# desligue lá para não sair repetido.
# A Página aceita Reels de 3 a 90 s: cortes mais longos ficam fora daqui.
# ---------------------------------------------------------------------
[facebook]
ativo = false
videos = true
envio = "navegador"
# O link da Página (https://www.facebook.com/SuaPagina ou
# https://www.facebook.com/profile.php?id=...) ou o nome exato dela.
# Na API oficial e no Upload-Post, a Página vem da escolha na lista do painel.
pagina = ""
# Preenchidos pelo AutoCortes quando ele confirma a Página
pagina_id = ""
pagina_nome = ""
# API oficial: vazios = o app do [instagram]
app_id = ""
app_secret = ""
versao_api = "v26.0"
max_segundos = 90
horarios = ["13:30", "21:45"]
dias = []

# ---------------------------------------------------------------------
# Kwai: não tem API de postagem para criadores nem envio pelo site.
# No horário, o AutoCortes cria uma tarefa com o vídeo e a legenda, e você
# posta pelo app do Kwai no celular (veja [manual]).
# ---------------------------------------------------------------------
[kwai]
ativo = false
videos = true
envio = "manual"
horarios = ["12:00", "19:30"]
dias = []

# ---------------------------------------------------------------------
# Bilibili: a API de envio (Open Platform) é só para empresas chinesas
# cadastradas. No horário, o AutoCortes cria uma tarefa com o vídeo, o
# título, a descrição e as tags, e você envia em
#   https://member.bilibili.com/platform/upload/video/frame
# Marque o tipo 转载 (repost) e informe a fonte: o filme não é obra sua.
# ---------------------------------------------------------------------
[bilibili]
ativo = false
videos = true
# "manual" (a tarefa no Início) ou "navegador" (veja [navegador]: contraria os termos)
envio = "manual"
# 08:00 em Brasília = 19:00 em Pequim
horarios = ["08:00"]
dias = []
# Tags fixas (sem #), somadas às hashtags do post
tags = ["电影", "影视剪辑", "电影片段"]
