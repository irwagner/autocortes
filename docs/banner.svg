<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">AutoCortes</title>
  <desc id="descricao">Filmes viram Shorts, Reels e TikToks: o AutoCortes corta, legenda e posta sozinho, direto do seu PC.</desc>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18141d"/>
      <stop offset="1" stop-color="#0b0a0e"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.8" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#ff7a2f" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilho2" cx="0.06" cy="0.12" r="0.45">
      <stop offset="0" stop-color="#ffc233" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffc233" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc233"/>
      <stop offset=".55" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#ff4b3e"/>
    </linearGradient>
    <linearGradient id="marcaTexto" gradientUnits="userSpaceOnUse" x1="370" y1="0" x2="650" y2="0">
      <stop offset="0" stop-color="#ffc233"/>
      <stop offset=".55" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#ff4b3e"/>
    </linearGradient>
    <linearGradient id="ceu1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf6b"/>
      <stop offset=".6" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#d9435f"/>
    </linearGradient>
    <linearGradient id="ceu2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a55"/>
      <stop offset=".65" stop-color="#3b4f9a"/>
      <stop offset="1" stop-color="#6c5aa8"/>
    </linearGradient>
    <linearGradient id="ceu3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7de2d1"/>
      <stop offset=".55" stop-color="#2f9fb8"/>
      <stop offset="1" stop-color="#1d4e89"/>
    </linearGradient>
    <clipPath id="tela">
      <rect x="6" y="6" width="138" height="254" rx="18"/>
    </clipPath>
    <clipPath id="quadro">
      <rect x="6" y="92" width="138" height="78"/>
    </clipPath>
    <filter id="sombra" x="-40%" y="-25%" width="180%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect width="1280" height="400" rx="24" fill="url(#fundo)"/>
  <rect width="1280" height="400" rx="24" fill="url(#brilho)"/>
  <rect width="1280" height="400" rx="24" fill="url(#brilho2)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- ícone do painel -->
  <g transform="translate(72 84) scale(2.6)">
    <rect width="40" height="40" rx="11" fill="url(#marca)"/>
    <path d="M11 12.5h18a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2Z" fill="none" stroke="#1a0f00" stroke-width="2.4"/>
    <path d="M17.5 16.5v7l6-3.5z" fill="#1a0f00"/>
    <path d="M9 12.5 13 9M16 12.5l4-3.5M23 12.5l4-3.5" stroke="#1a0f00" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- nome e chamada -->
  <text x="200" y="163" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-1.5" fill="#ffffff">Auto<tspan fill="url(#marcaTexto)">Cortes</tspan></text>
  <text x="72" y="244" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#f1ecf4">Filmes viram Shorts, Reels e TikToks.</text>
  <text x="72" y="283" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#a7a1b1">Corta, legenda e posta sozinho, direto do seu PC.</text>

  <!-- redes -->
  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#ece8f1">
    <g transform="translate(72 312)">
      <rect width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <circle cx="17" cy="17" r="5" fill="#ff0033"/>
      <text x="29" y="23">YouTube Shorts</text>
    </g>
    <g transform="translate(242 312)">
      <rect width="96" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <circle cx="17" cy="17" r="5" fill="#25f4ee"/>
      <text x="29" y="23">TikTok</text>
    </g>
    <g transform="translate(348 312)">
      <rect width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <circle cx="17" cy="17" r="5" fill="#e1306c"/>
      <text x="29" y="23">Instagram Reels</text>
    </g>
    <g transform="translate(526 312)">
      <rect width="82" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <circle cx="17" cy="17" r="5" fill="#ff7a00"/>
      <text x="29" y="23">Kwai</text>
    </g>
    <g transform="translate(618 312)">
      <rect width="98" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <circle cx="17" cy="17" r="5" fill="#00a1d6"/>
      <text x="29" y="23">Bilibili</text>
    </g>
  </g>

  <!-- celular da esquerda: pôr do sol -->
  <g transform="translate(778 84) rotate(-9 75 133)">
    <g filter="url(#sombra)">
      <rect width="150" height="266" rx="24" fill="#1d1a22" stroke="#34303b" stroke-width="2"/>
      <g clip-path="url(#tela)">
        <rect x="6" y="6" width="138" height="254" fill="url(#ceu1)"/>
        <rect x="6" y="6" width="138" height="254" fill="#0b0a0e" fill-opacity="0.62"/>
        <text x="75" y="52" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', Arial, sans-serif" font-size="13" font-weight="900" fill="#ffffff">Seu Filme</text>
        <text x="75" y="70" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#e9e5ee">Parte 1</text>
        <g clip-path="url(#quadro)">
          <rect x="6" y="92" width="138" height="78" fill="url(#ceu1)"/>
          <circle cx="98" cy="132" r="13" fill="#fff4cf" fill-opacity="0.95"/>
          <polygon points="6,170 6,150 30,134 50,150 76,124 104,154 124,140 144,152 144,170" fill="#3a1d34"/>
          <polygon points="6,170 6,160 40,148 70,162 100,146 144,164 144,170" fill="#22111f"/>
        </g>
        <g text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', Arial, sans-serif" font-size="17" font-weight="900" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">
          <text x="75" y="204" fill="#ffffff">ISSO NÃO</text>
          <text x="75" y="226" fill="#ffd400">ACABOU</text>
        </g>
        <rect x="6" y="246" width="138" height="5" fill="#ffffff" fill-opacity="0.18"/>
        <rect x="6" y="246" width="48" height="5" fill="#ffd400"/>
      </g>
      <rect x="60" y="12" width="30" height="5" rx="2.5" fill="#000000" fill-opacity="0.55"/>
    </g>
  </g>

  <!-- celular da direita: mar -->
  <g transform="translate(1068 84) rotate(9 75 133)">
    <g filter="url(#sombra)">
      <rect width="150" height="266" rx="24" fill="#1d1a22" stroke="#34303b" stroke-width="2"/>
      <g clip-path="url(#tela)">
        <rect x="6" y="6" width="138" height="254" fill="url(#ceu3)"/>
        <rect x="6" y="6" width="138" height="254" fill="#0b0a0e" fill-opacity="0.62"/>
        <text x="75" y="52" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', Arial, sans-serif" font-size="13" font-weight="900" fill="#ffffff">Seu Filme</text>
        <text x="75" y="70" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#e9e5ee">Parte 3</text>
        <g clip-path="url(#quadro)">
          <rect x="6" y="92" width="138" height="78" fill="url(#ceu3)"/>
          <circle cx="75" cy="150" r="16" fill="#ffe8a3"/>
          <rect x="6" y="150" width="138" height="20" fill="#163a66"/>
          <path d="M6 157q8-3 16 0t16 0t16 0t16 0t16 0t16 0t16 0t16 0t16 0" fill="none" stroke="#7fd3e6" stroke-width="1.2" stroke-opacity="0.7"/>
          <rect x="66" y="152" width="18" height="2" rx="1" fill="#ffe8a3" fill-opacity="0.85"/>
          <rect x="62" y="162" width="26" height="1.6" rx="0.8" fill="#ffe8a3" fill-opacity="0.5"/>
        </g>
        <g text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', Arial, sans-serif" font-size="17" font-weight="900" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">
          <text x="75" y="204" fill="#ffffff">OLHA SÓ</text>
          <text x="75" y="226" fill="#ffd400">AQUILO</text>
        </g>
        <rect x="6" y="246" width="138" height="5" fill="#ffffff" fill-opacity="0.18"/>
        <rect x="6" y="246" width="116" height="5" fill="#ffd400"/>
      </g>
      <rect x="60" y="12" width="30" height="5" rx="2.5" fill="#000000" fill-opacity="0.55"/>
    </g>
  </g>

  <!-- celular do meio: cidade à noite -->
  <g transform="translate(923 67)">
    <g filter="url(#sombra)">
      <rect width="150" height="266" rx="24" fill="#1d1a22" stroke="#3a3541" stroke-width="2"/>
      <g clip-path="url(#tela)">
        <rect x="6" y="6" width="138" height="254" fill="url(#ceu2)"/>
        <rect x="6" y="6" width="138" height="254" fill="#0b0a0e" fill-opacity="0.58"/>
        <text x="75" y="52" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', Arial, sans-serif" font-size="13" font-weight="900" fill="#ffffff">Seu Filme</text>
        <text x="75" y="70" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#e9e5ee">Parte 2</text>
        <g clip-path="url(#quadro)">
          <rect x="6" y="92" width="138" height="78" fill="url(#ceu2)"/>
          <circle cx="36" cy="112" r="8" fill="#eef2ff"/>
          <g fill="#ffffff" fill-opacity="0.8">
            <circle cx="64" cy="102" r="1"/>
            <circle cx="92" cy="108" r="0.9"/>
            <circle cx="118" cy="100" r="1.1"/>
            <circle cx="136" cy="114" r="0.8"/>
            <circle cx="18" cy="126" r="0.8"/>
          </g>
          <g fill="#10142a">
            <rect x="12" y="140" width="16" height="30"/>
            <rect x="30" y="128" width="14" height="42"/>
            <rect x="46" y="146" width="20" height="24"/>
            <rect x="68" y="120" width="16" height="50"/>
            <rect x="86" y="138" width="18" height="32"/>
            <rect x="106" y="130" width="14" height="40"/>
            <rect x="122" y="148" width="22" height="22"/>
          </g>
          <g fill="#ffd76a" fill-opacity="0.85">
            <rect x="34" y="134" width="3" height="3"/>
            <rect x="39" y="144" width="3" height="3"/>
            <rect x="72" y="128" width="3" height="3"/>
            <rect x="77" y="140" width="3" height="3"/>
            <rect x="72" y="152" width="3" height="3"/>
            <rect x="110" y="138" width="3" height="3"/>
            <rect x="91" y="146" width="3" height="3"/>
          </g>
        </g>
        <g text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', Arial, sans-serif" font-size="17" font-weight="900" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">
          <text x="75" y="204" fill="#ffffff">VOU PARA</text>
          <text x="75" y="226" fill="#ffd400">CASA</text>
        </g>
        <rect x="6" y="246" width="138" height="5" fill="#ffffff" fill-opacity="0.18"/>
        <rect x="6" y="246" width="86" height="5" fill="#ffd400"/>
      </g>
      <rect x="60" y="12" width="30" height="5" rx="2.5" fill="#000000" fill-opacity="0.55"/>
    </g>
  </g>
</svg>
