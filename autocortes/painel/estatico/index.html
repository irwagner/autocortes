<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ac-token" content="{{TOKEN}}">
<meta name="color-scheme" content="dark">
<title>AutoCortes</title>
<link rel="icon" href="/static/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css?v={{VERSAO}}">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="grad-ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#feda75"/>
      <stop offset=".3" stop-color="#fa7e1e"/>
      <stop offset=".6" stop-color="#d62976"/>
      <stop offset="1" stop-color="#4f5bd5"/>
    </linearGradient>
    <linearGradient id="grad-logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc233"/>
      <stop offset=".55" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#ff4b3e"/>
    </linearGradient>
    <clipPath id="corte-fb"><circle cx="12" cy="12" r="11"/></clipPath>
  </defs>
</svg>

<a class="pular" href="#conteudo" data-acao="pular">Pular para o conteúdo</a>

<div class="app">
  <aside class="lateral">
    <a class="marca" href="#/inicio" aria-label="AutoCortes, início">
      <svg class="marca-logo" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="11" fill="url(#grad-logo)"/>
        <path d="M11 12.5h18a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2Z" fill="none" stroke="#1a0f00" stroke-width="2.4"/>
        <path d="M17.5 16.5v7l6-3.5z" fill="#1a0f00"/>
        <path d="M9 12.5 13 9M16 12.5l4-3.5M23 12.5l4-3.5" stroke="#1a0f00" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span class="marca-nome">Auto<b>Cortes</b></span>
    </a>
    <nav id="menu" aria-label="Menu principal"></nav>
    <div class="lateral-rodape" id="lateral-status"></div>
  </aside>

  <main class="principal">
    <header class="topo">
      <div class="topo-titulo">
        <h1 id="titulo-pagina">AutoCortes</h1>
        <p id="subtitulo-pagina"></p>
      </div>
      <div class="topo-acoes" id="topo-acoes"></div>
    </header>
    <div id="faixa" role="status" aria-live="polite"></div>
    <section id="conteudo" tabindex="-1"></section>
  </main>
</div>

<div id="modal-raiz"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="/static/nucleo.js?v={{VERSAO}}"></script>
<script src="/static/pg_inicio.js?v={{VERSAO}}"></script>
<script src="/static/pg_agenda.js?v={{VERSAO}}"></script>
<script src="/static/pg_cortes.js?v={{VERSAO}}"></script>
<script src="/static/pg_filmes.js?v={{VERSAO}}"></script>
<script src="/static/pg_estudio.js?v={{VERSAO}}"></script>
<script src="/static/pg_criacao.js?v={{VERSAO}}"></script>
<script src="/static/pg_redes.js?v={{VERSAO}}"></script>
<script src="/static/pg_perfis.js?v={{VERSAO}}"></script>
<script src="/static/pg_config.js?v={{VERSAO}}"></script>
<script src="/static/pg_registro.js?v={{VERSAO}}"></script>
<script src="/static/app.js?v={{VERSAO}}"></script>
</body>
</html>
